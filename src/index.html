<!DOCTYPE html>
<!--suppress ALL -->
<html>

<head>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1">
    <script defer src="resources/dhis-header-bar.js"></script>
</head>

<body>
    <div id="dhis-header-bar"></div>

    <div id="mainView">
        <div id="runningJobs" class="section">
            <h4>Running Jobs</h4>
            <div id="runningJobsContainer" class="cards-container"></div>
        </div>

        <div id="currentTaskDetails" class="task-ticker">
            <div id="tickerContent">Fetching task updates...</div>
        </div>

        <div id="jobInfoModal" class="modal">
            <div class="modal-content">
                <h4>Job Details</h4>
                <div id="jobInfoModalContent">
                    <!-- Detailed task information will be rendered here -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-close btn">Close</button>
            </div>
        </div>
        
        
        <div id="allJobs" class="section">
            <h4>All Jobs</h4>
            <table id="jobsTable" class="display">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>ID</th>
                        <th>Type</th>
                        <th>Schedule</th>
                        <th>Next run</th>
                        <th>Status</th>
                        <th>On/off</th>
                        <th>Info</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    
    <!-- Modal for displaying job parameters -->
    <div id="jobInfoModal" class="modal">
        <div class="modal-content">
            <h4>Job Parameters</h4>
            <div id="jobParamsContent"></div>
        </div>
        <div class="modal-footer">
            <a href="#!" class="modal-close waves-effect waves-green btn-flat">Close</a>
        </div>
    </div>
    
    
      
</body>

</html>
